[package]
name = "DataBox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
db-core    = { path = "crates/db-core" }
async-trait = "0.1"
chrono      = { version = "0.4", features = ["serde"] }
serde       = { version = "1", features = ["derive"] }
tokio       = { version = "1", features = ["full"] }
thiserror   = "2"
serde_json  = "1"
sqlx        = { version = "0.8", features = ["runtime-tokio", "chrono", "json"] }
mongodb     = "3"
redis       = { version = "0.26", features = ["tokio-comp", "aio"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "databox"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
db-core.workspace = true
db-postgres = { path = "crates/db-postgres" }
db-mysql    = { path = "crates/db-mysql" }
db-sqlite   = { path = "crates/db-sqlite" }
db-mongo    = { path = "crates/db-mongo" }
db-redis    = { path = "crates/db-redis" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2.8.0"
tauri-plugin-store = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26.1"
